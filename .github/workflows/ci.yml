name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19'
          cache: npm
      - run: npm ci
      # Runs format:check, lint, typecheck, test:domain, test:adapters, test:scripts, test:coverage (istanbul thresholds), and build
      - run: npm run check
      - run: npm audit --omit=dev
